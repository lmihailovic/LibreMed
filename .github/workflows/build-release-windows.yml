name: Build & Publish Windows .exe

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

jobs:
  build_and_test:
    name: Build + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Run tests
        run: dotnet test -c Release --no-build

  publish_windows:
    name: Publish Windows (.exe)
    runs-on: windows-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish .exe (win-x64, single file)
        shell: pwsh
        run: |
          dotnet publish ./LibreMed/LibreMed.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            -o ./artifacts/win-x64

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreMed-win-x64
          path: artifacts/win-x64/

      - name: Create GitHub Release + upload .exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/win-x64/**
