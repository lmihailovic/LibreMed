name: Build & Publish Avalonia Windows .exe

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]       # only build exe for version tags
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build LibreMed/LibreMed.csproj -c Release --no-restore

      # - name: Run unit tests
      #   run: dotnet test LibreMed.Tests/LibreMed.Tests.csproj -c Release --no-build
  publish_windows:
    name: Publish Windows .exe
    runs-on: windows-latest
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish Windows exe (self-contained, single-file)
        run: |
          dotnet publish LibreMed/LibreMed.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            -o artifacts/win-x64

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreMed-win-x64
          path: artifacts/win-x64/**

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/win-x64/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

